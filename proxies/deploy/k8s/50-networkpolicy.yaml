# §9.1: only intra-namespace traffic reaches postgres/nats; no NodePort/LB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proxyfarm
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-internal
  namespace: proxyfarm
spec:
  podSelector:
    matchLabels: {app: postgres}
  ingress:
    - from:
        - podSelector: {}
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-allow-internal
  namespace: proxyfarm
spec:
  podSelector:
    matchLabels: {app: nats}
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 4222, protocol: TCP}
        - {port: 8222, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-ingress
  namespace: proxyfarm
spec:
  podSelector:
    matchLabels: {app: api}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{port: 8080, protocol: TCP}]
    - from:
        - podSelector: {} # readiness probes from within the namespace
      ports: [{port: 8080, protocol: TCP}]
