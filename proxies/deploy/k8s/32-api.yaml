apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: proxyfarm
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/burdi14/proxyfarm/api:latest
          args:
            - --addr=:8080
            - --nats=$(NATS_URL)
            - --pg=$(PG_DSN)
            - --web-dir=/web
          envFrom:
            - configMapRef: {name: proxyfarm-config}
            - secretRef: {name: proxyfarm-secrets}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: proxyfarm
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080, name: http}]
