# fetcher CronJob: sources live in the DB; runs every 30 minutes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetcher
  namespace: proxyfarm
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: fetcher
              image: ghcr.io/burdi14/proxyfarm/fetcher:latest
              args:
                - --once
                - --nats=$(NATS_URL)
                - --pg=$(PG_DSN)
              envFrom:
                - configMapRef: {name: proxyfarm-config}
                - secretRef: {name: proxyfarm-secrets}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
---
# db-ip CronJob: refresh the City Lite mmdb (§6 — no keys, no signup).
# Tries the current month first, falls back to the previous one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbip-update
  namespace: proxyfarm
spec:
  schedule: "17 3 * * 3" # weekly
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dbip-update
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  apk add --no-cache curl gzip
                  for M in $(date +%Y-%m) $(date -d '1 month ago' +%Y-%m); do
                    URL="https://download.db-ip.com/free/dbip-city-lite-${M}.mmdb.gz"
                    echo "trying $URL"
                    if curl -sfL -o /data/dbip-city-lite.mmdb.gz "$URL"; then
                      gunzip -f /data/dbip-city-lite.mmdb.gz
                      echo "mmdb updated from $M"
                      exit 0
                    fi
                  done
                  echo "no db-ip file available" >&2
                  exit 1
              volumeMounts:
                - {name: mmdb, mountPath: /data}
          volumes:
            - name: mmdb
              persistentVolumeClaim: {claimName: mmdb}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mmdb
  namespace: proxyfarm
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Mi}}
