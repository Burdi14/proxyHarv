# pg_dump CronJob → S3-compatible storage (§9.8). RPO 24h.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: proxyfarm
spec:
  schedule: "23 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  pg_dump "$PG_DSN" | gzip > /tmp/proxyfarm-$(date +%Y%m%d).sql.gz
                  mc alias set backup "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
                  mc cp /tmp/proxyfarm-*.sql.gz backup/"$S3_BUCKET"/pg/
                  rm -f /tmp/proxyfarm-*.sql.gz
              envFrom:
                - secretRef: {name: proxyfarm-secrets}
                - configMapRef: {name: proxyfarm-config}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
