# §9.1: TLS via cert-manager/Let's Encrypt, HSTS, rate limits on /api/*.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: proxyfarm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    # rate limit for /api/* (§8); static assets unlimited
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/enable-access-log: "false" # §9.6 privacy
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # SSE
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [proxyfarm.example.com]
      secretName: proxyfarm-tls
  rules:
    - host: proxyfarm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 80}
